[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perceive"
version = "2.0.0"
description = "PERCEIVE - a governance kernel with a verifiable audit ledger"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Optional: exposes PERCEIVE gates as CNS gates (src/perceive/cns_connector.py).
# Pinned to tag v1.9.0. Not a runtime dependency.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.3.0"]
dev = ["pytest>=7"]

[project.scripts]
perceive = "perceive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
