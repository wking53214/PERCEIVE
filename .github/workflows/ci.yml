name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: CLI smoke test
        run: |
          perceive demo --patients 20
          perceive verify --patients 20
          perceive gates
          perceive export sox --patients 10

  cns:
    # The job above installs only `.[dev]`, so tests/test_cns_connector.py
    # skips there as a module and a green check says nothing about the
    # connector. This job installs the cns extra and sets
    # PERCEIVE_REQUIRE_CNS=1, which turns a missing cns into a failure, so
    # the connector tests cannot silently skip here. Only 3.11 and 3.12:
    # CNS needs 3.10 or newer, so the extra cannot install on 3.9.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,cns]"
      - name: Test with CNS required
        env:
          PERCEIVE_REQUIRE_CNS: "1"
        run: python -m pytest -q -rs
